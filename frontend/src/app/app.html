<div class="container">

  <h1>Media Downloader</h1>

  <p>Baixe e converta seus arquivos de mídia</p>

  <input
    type="text"
    placeholder="Cole a URL do vídeo aqui"
    [(ngModel)]="url"
    [disabled]="loading"
  />

  <div class="formats">
    <button
      [class.selected]="format === 'mp3'"
      (click)="selectFormat('mp3')"
      [disabled]="loading"
    >
      MP3
    </button>

    <button
      [class.selected]="format === 'mp4'"
      (click)="selectFormat('mp4')"
      [disabled]="loading"
    >
      MP4
    </button>
  </div>

  <p>Formato selecionado: {{ format }}</p>

  <button
    class="convert-button"
    (click)="convert()"
    [disabled]="loading"
  >
    @if (loading) {
      Processando...
    } @else {
      Converter
    }
  </button>

  @if (statusMessage) {
    <p class="status-message" role="status">
      {{ statusMessage }}
    </p>
  }

  @if (errorMessage) {
    <p class="error-message" role="alert">
      {{ errorMessage }}
    </p>
  }

  @if (downloadUrl()) {
    <p>Ta na mão chefe, aproveita!</p>

    <a
      class="download-button"
      [href]="downloadUrl()"
      target="_blank"
    >
      Baixar arquivo
    </a>
  }

</div>
